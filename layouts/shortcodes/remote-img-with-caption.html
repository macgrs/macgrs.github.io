{{- $url     := .Get "src" -}}
{{- $alt     := .Get "alt"     | default "" -}}
{{- $height  := .Get "height"  | default "" -}}
{{- $caption := .Get "caption" | default "" -}}
{{- $align   := .Get "align"   | default "center" -}}
<figure style="display: flex; flex-direction: column; align-items: {{ $align }};">
  <img src="{{ $url }}"
       alt="{{ $alt }}"
       loading="lazy"
       {{- with $height }} style="max-height: {{ . }}px; width: auto;"{{ end }}>
  {{- with $caption }}
  <figcaption>{{ . }}</figcaption>
  {{- end }}
</figure>
