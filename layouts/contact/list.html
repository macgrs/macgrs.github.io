{{ define "main" }}
<div class="content-page">
  <h1>{{ .Title }}</h1>
  {{ .Content }}
  {{ with .Site.Params.email }}
  <h4>{{ i18n "dropMeALine" }}</h4>
  <form id="contact-form" class="contact-form" method="post" action="https://formspree.io/{{ . }}">
    <div class="form-group">
      <label for="name">{{ i18n "yourName" }}</label>
      <input type="text" name="name" id="name" required class="form-control">
    </div>
    <div class="form-group">
      <label for="email">{{ i18n "yourEmail" }}</label>
      <input type="email" name="email" id="email" required class="form-control">
    </div>
    <div class="form-group">
      <label for="message">{{ i18n "yourMessage" }}</label>
      <textarea rows="4" name="message" id="message" required class="form-control"></textarea>
    </div>
    <div>
      <button type="submit" class="btn-ghost">{{ i18n "send" }}</button>
    </div>
  </form>
  {{ end }}
</div>
{{ end }}
